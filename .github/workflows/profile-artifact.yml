name: verify profile artifact

on:
  pull_request:
  push:
    paths:
      - "profile/**"
      - "scripts/**"
      - "package.json"
      - "images/profile-runtime.svg"
      - "images/*-button-runtime.svg"
      - ".github/workflows/profile-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:profile
      - name: Confirm generated files are current
        run: git diff --exit-code
