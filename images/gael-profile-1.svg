<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Gael Garcia — Software Engineer</title>
  <desc id="desc">A collectible profile card beside a terminal showing a successful software deployment.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f14"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7849"/>
      <stop offset="0.55" stop-color="#ff4f73"/>
      <stop offset="1" stop-color="#8c5cff"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#77f9d4"/>
      <stop offset="0.5" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#fff0a6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#08090c" fill-opacity="0.24"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="30" y="30" width="350" height="480" rx="30"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #8d95a5; }
      .bright { fill: #f5f7fb; }
      .success { fill: #77f9d4; }
      @keyframes blink { 0%, 45% { opacity: 1 } 46%, 100% { opacity: 0 } }
      @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="540" rx="36" fill="url(#background)"/>
  <rect width="1200" height="540" rx="36" fill="url(#grid)"/>

  <!-- Collectible identity card -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="350" height="480" rx="30" fill="url(#card)"/>
  </g>
  <g clip-path="url(#cardClip)">
    <circle cx="337" cy="94" r="116" fill="#ffe89a" fill-opacity="0.24"/>
    <circle cx="62" cy="414" r="144" fill="#4b2dbd" fill-opacity="0.34"/>
    <path d="M-10 358C80 274 184 422 278 322C335 261 393 291 422 304V530H-10Z" fill="#0a0b10" fill-opacity="0.84"/>
    <path d="M-10 371C90 291 180 431 286 333C343 280 398 302 427 318" fill="none" stroke="url(#holo)" stroke-width="5"/>
    <rect x="30" y="30" width="350" height="480" fill="url(#dots)"/>
    <text x="61" y="235" class="sans" font-size="164" font-weight="900" letter-spacing="-4" fill="#0a0b10">GG</text>
    <text x="55" y="225" class="sans" font-size="164" font-weight="900" letter-spacing="-4" fill="#fff7e7">GG</text>
  </g>
  <rect x="30.75" y="30.75" width="348.5" height="478.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity="0.48" stroke-width="1.5"/>

  <g class="sans">
    <rect x="54" y="54" width="51" height="28" rx="14" fill="#0a0b10"/>
    <text x="79.5" y="73" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.5" fill="#fff7e7">1/1</text>
    <text x="354" y="74" text-anchor="end" font-size="12" font-weight="800" letter-spacing="1.5" fill="#0a0b10">№ 1627</text>

    <text x="55" y="402" font-size="15" font-weight="700" letter-spacing="2.8" fill="#c9b9ff">SOFTWARE ENGINEER</text>
    <text x="55" y="449" font-size="43" font-weight="900" letter-spacing="-1.5" fill="#fff">GAEL</text>
    <text x="55" y="477" font-size="13" font-weight="700" letter-spacing="1.7" fill="#77f9d4">CURIOUS BY DEFAULT</text>
    <circle cx="342" cy="464" r="6" fill="#77f9d4" class="pulse"/>
  </g>

  <!-- Deployment console -->
  <g transform="translate(410 30)">
    <rect width="760" height="480" rx="26" fill="#11141a" stroke="#272c36" stroke-width="2"/>
    <path d="M0 58H760" stroke="#272c36"/>
    <circle cx="28" cy="29" r="6" fill="#ff665c"/>
    <circle cx="50" cy="29" r="6" fill="#ffbd44"/>
    <circle cx="72" cy="29" r="6" fill="#00ca4e"/>
    <text x="380" y="34" text-anchor="middle" class="mono muted" font-size="13">gael@github — deploy</text>

    <g class="mono" font-size="18">
      <text x="38" y="105" class="muted">$</text>
      <text x="61" y="105" class="bright">npx deploy gael@latest --verbose</text>
      <rect x="403" y="87" width="10" height="22" rx="1" fill="#77f9d4" class="cursor"/>

      <text x="38" y="151" class="success">✓</text>
      <text x="69" y="151" class="muted">profile compiled successfully</text>

      <rect x="38" y="177" width="684" height="1" fill="#272c36"/>

      <g font-size="16">
        <text x="38" y="215" fill="#7ab8ff">role</text>
        <text x="166" y="215" class="bright">Software Engineer</text>

        <text x="38" y="249" fill="#7ab8ff">studying</text>
        <text x="166" y="249" class="bright">Computer Engineering - AI @ University of Florida</text>

        <text x="38" y="283" fill="#7ab8ff">minor</text>
        <text x="166" y="283" class="bright">Mathematics</text>

        <text x="38" y="317" fill="#7ab8ff">previously</text>
        <text x="166" y="317" class="bright">SWE Intern @ Visa</text>

        <text x="38" y="351" fill="#7ab8ff">building</text>
        <text x="166" y="351" class="bright">AI systems · full-stack products</text>
      </g>

      <rect x="38" y="376" width="684" height="1" fill="#272c36"/>
      <text x="38" y="414" fill="#7ab8ff">→</text>
      <text x="69" y="414" class="bright">production is live.</text>
    </g>

    <g class="mono" font-size="12" font-weight="700" letter-spacing="0.5">
      <rect x="38" y="429" width="90" height="28" rx="8" fill="#1b2029"/>
      <text x="83" y="448" text-anchor="middle" fill="#c8cfdb">TYPESCRIPT</text>
      <rect x="138" y="429" width="63" height="28" rx="8" fill="#1b2029"/>
      <text x="169.5" y="448" text-anchor="middle" fill="#c8cfdb">REACT</text>
      <rect x="211" y="429" width="70" height="28" rx="8" fill="#1b2029"/>
      <text x="246" y="448" text-anchor="middle" fill="#c8cfdb">PYTHON</text>
      <rect x="291" y="429" width="73" height="28" rx="8" fill="#1b2029"/>
      <text x="327.5" y="448" text-anchor="middle" fill="#c8cfdb">FASTAPI</text>
      <rect x="374" y="429" width="48" height="28" rx="8" fill="#1b2029"/>
      <text x="398" y="448" text-anchor="middle" fill="#c8cfdb">AWS</text>
      <text x="722" y="448" text-anchor="end" fill="#77f9d4">main ●</text>
    </g>
  </g>
</svg>
