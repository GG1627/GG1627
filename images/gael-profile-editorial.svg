<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Gael Garcia — Software Engineer</title>
  <desc id="desc">An editorial profile for Gael Garcia, a software engineer studying computer engineering and artificial intelligence at the University of Florida.</desc>
  <defs>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="498" rx="12"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; }
      .value { font-size: 17px; font-weight: 550; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="#f3ecdf"/>
    <rect width="390" height="500" fill="#172033"/>
    <rect x="374" width="16" height="500" fill="#e46f52"/>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="12" fill="none" stroke="#172033" stroke-width="2"/>

  <!-- Identity -->
  <g class="sans">
    <text x="38" y="48" class="label" fill="#b8c0d0">IDENTITY / GG1627</text>
    <text x="350" y="48" text-anchor="end" class="mono" font-size="12" fill="#e46f52">1 / 1</text>

    <text x="35" y="229" font-size="166" font-weight="850" letter-spacing="-3" fill="#f3ecdf">GG</text>
    <path d="M38 263H337" stroke="#4e5a72"/>

    <text x="38" y="325" class="serif" font-size="43" font-weight="700" fill="#f3ecdf">Gael Garcia</text>
    <text x="40" y="363" class="label" fill="#c8cede">SOFTWARE ENGINEER</text>

    <text x="40" y="450" class="mono" font-size="12" fill="#aeb6c8">CURIOUS BY DEFAULT</text>
    <rect x="40" y="465" width="26" height="3" fill="#e46f52"/>
    <rect x="70" y="465" width="26" height="3" fill="#3a5ccf"/>
    <rect x="100" y="465" width="26" height="3" fill="#4f8a78"/>
  </g>

  <!-- Profile -->
  <g class="sans">
    <text x="438" y="48" class="label" fill="#68655f">PROFILE / 01</text>
    <text x="1154" y="48" text-anchor="end" class="mono" font-size="12" fill="#68655f">GG1627 / GITHUB</text>

    <text x="436" y="112" class="serif" font-size="45" font-weight="700" fill="#172033">Software engineer working</text>
    <text x="436" y="163" class="serif" font-size="45" font-weight="700" fill="#172033">across AI and product.</text>

    <path d="M438 200H1155" stroke="#bdb8ad"/>

    <text x="438" y="239" class="label" fill="#68655f">ROLE</text>
    <text x="606" y="239" class="value" fill="#172033">Software Engineer</text>

    <path d="M438 263H1155" stroke="#d0cbc0"/>
    <text x="438" y="300" class="label" fill="#68655f">EDUCATION</text>
    <text x="606" y="300" class="value" fill="#172033">Computer Engineering — AI, University of Florida</text>

    <path d="M438 324H1155" stroke="#d0cbc0"/>
    <text x="438" y="361" class="label" fill="#68655f">MINOR</text>
    <text x="606" y="361" class="value" fill="#172033">Mathematics</text>

    <path d="M438 385H1155" stroke="#d0cbc0"/>
    <text x="438" y="422" class="label" fill="#68655f">PREVIOUSLY</text>
    <text x="606" y="422" class="value" fill="#172033">Software Engineering Intern, Visa</text>

    <path d="M438 446H1155" stroke="#d0cbc0"/>
    <text x="438" y="478" class="label" fill="#e46f52">FOCUS</text>
    <text x="606" y="478" class="mono" font-size="14" fill="#172033">AI SYSTEMS / FULL-STACK PRODUCTS</text>
  </g>
</svg>
