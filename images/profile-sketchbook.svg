    <text x="169" y="533" class="sans" font-size="17" font-weight="800" fill="#182033">make ambitious ideas real</text>
    <text x="169" y="558" class="mono small" fill="#182033">OPEN / LABELS: CURIOSITY, SHIP-IT</text>
  </g>

