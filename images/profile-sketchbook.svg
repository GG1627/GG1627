  <text x="42" y="704" class="mono tiny" fill="#596174">imperfections: deterministic</text>
  <text x="1158" y="704" text-anchor="end" class="mono tiny" fill="#596174">0 ERRORS / SEVERAL QUESTIONABLE IDEAS</text>
</svg>
