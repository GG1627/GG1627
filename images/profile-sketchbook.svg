    <text x="655" y="654.18" text-anchor="middle" class="mono sticker" fill="#182033">FastAPI</text>
  </g>
<g transform="rotate(-3.15 793 650.34)">
    <path d="M740 629.34 L848 631.34 L846 669.34 L738 667.34 Z" fill="#ff765b" stroke="#182033" stroke-width="1.4"/>
    <text x="793" y="655.34" text-anchor="middle" class="mono sticker" fill="#182033">Docker</text>
  </g>
<g transform="rotate(-2.8 931 648.82)">
    <path d="M878 627.82 L986 629.82 L984 667.82 L876 665.82 Z" fill="#9d8cff" stroke="#182033" stroke-width="1.4"/>
