<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Gael Garcia — source-controlled engineering sketchbook</title>
  <desc id="desc">An imperfectly drawn software sketchbook showing Gael's source, experience, projects, and tools.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#cec5b2" fill-opacity="0.62"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="10" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .hand { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
      .tiny { font-size: 10px; letter-spacing: 1px; }
      .small { font-size: 12px; }
      .code { font-size: 15px; }
      .project { font-size: 28px; font-weight: 850; letter-spacing: -1px; }
      .sticker { font-size: 12px; font-weight: 800; }
      .dash { stroke-dasharray: 7 10; animation: travel 5s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes travel { to { stroke-dashoffset: -68; } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="718" rx="4" fill="#f2ead7" stroke="#182033" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="718" rx="4" fill="url(#dots)"/>
  <path d="M600 18C596 122 605 221 599 330C594 441 606 556 600 701" fill="none" stroke="#cec5b2" stroke-width="2"/>
  <path d="M603 18C599 122 608 221 602 330C597 441 609 556 603 701" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>

  <!-- Masthead, deliberately misregistered -->
  <text x="42" y="45" class="mono tiny" fill="#596174">WORKING TREE / GG1627 / BUILD b0dc01f</text>
  <text x="1155" y="45" text-anchor="end" class="hand" font-size="13" fill="#3e63dd" transform="rotate(-2 1155 45)">not final on purpose</text>
  <path d="M1004 50C1050 57 1105 55 1159 49" fill="none" stroke="#3e63dd" stroke-width="1.5"/>

  <g class="sans" font-weight="900" font-size="104" fill="#182033">
    <text x="40" y="146" transform="rotate(-2 40 146)">G</text>
    <text x="119" y="146" transform="rotate(1.5 119 146)">A</text>
    <text x="196" y="146" transform="rotate(-1 196 146)">E</text>
    <text x="262" y="146" transform="rotate(2 262 146)">L</text>
  </g>
  <rect x="42" y="157" width="296" height="17" fill="#d8ff64" transform="rotate(-1 42 157)"/>
  <text x="48" y="173" class="mono" font-size="13" font-weight="800" fill="#182033">SOFTWARE ENGINEER / MAKES THINGS MOVE</text>

  <!-- Source slip -->
  
  <g transform="rotate(-0.8 287 352)">
    <path d="M45 205 L528 207 L532 495 L47 499 Z" fill="#182033" opacity="0.16" transform="translate(5 6)"/>
    <path d="M45 205 L528 207 L532 495 L47 499 Z" fill="#fffaf0" stroke="#182033" stroke-width="1.6" filter="url(#rough)"/>
  </g>
  <g transform="rotate(-0.8 287 352)">
    <rect x="232" y="194" width="110" height="25" fill="#f4cf62" fill-opacity="0.68" transform="rotate(2 287 206)"/>
    <text x="65" y="238" class="mono tiny" fill="#596174">gael.ts / MODIFIED</text>
    <path d="M64 252H508" stroke="#cec5b2"/>

    <g class="mono code" fill="#182033" xml:space="preserve">
      <text x="66" y="285"><tspan fill="#9d8cff">const</tspan> gael = {</text>
      <text x="66" y="318">  studies: <tspan fill="#3e63dd">"CE + AI @ UF"</tspan>,</text>
      <text x="66" y="351">  minor: <tspan fill="#3e63dd">"mathematics"</tspan>,</text>
      <text x="66" y="384">  previously: <tspan fill="#3e63dd">"SWE @ Visa"</tspan>,</text>
      <text x="66" y="417">  builds: [<tspan fill="#3e63dd">"AI"</tspan>, <tspan fill="#3e63dd">"products"</tspan>],</text>
      <text x="66" y="450">  status: <tspan fill="#3e63dd">"still compiling"</tspan>,</text>
      <text x="66" y="483">};</text>
      <rect x="92" y="462" width="8" height="22" fill="#ff765b" class="blink"/>
    </g>

    <text x="392" y="369" class="hand" font-size="13" fill="#ff765b" transform="rotate(-4 392 369)">learned a lot here</text>
    
  <path d="M390 373C368 379 354 382 337 383" fill="none" stroke="#ff765b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M390 373C368 379 354 382 337 383" transform="translate(1.21 1.30)" fill="none" stroke="#ff765b" stroke-width="0.7" stroke-opacity="0.48" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="465" class="hand" font-size="14" fill="#3e63dd" transform="rotate(2 350 465)">this is a feature.</text>
  </g>

  <!-- Issue ticket -->
  <g transform="rotate(1.8 286 562)">
    <path d="M48 522H520V603H48Z" fill="#5dd8cc" stroke="#182033" stroke-width="1.7" filter="url(#rough)"/>
    <path d="M145 522V603" stroke="#182033" stroke-dasharray="4 5"/>
    <text x="68" y="550" class="mono tiny" fill="#182033">ISSUE</text>
    <text x="68" y="580" class="sans" font-size="24" font-weight="900" fill="#182033">#1627</text>
    <text x="169" y="553" class="sans" font-size="17" font-weight="800" fill="#182033">make ambitious ideas real</text>
    <text x="169" y="579" class="mono small" fill="#182033">OPEN / LABELS: CURIOSITY, SHIP-IT</text>
  </g>

  <!-- Hand-routed project flow -->
  <text x="665" y="91" class="hand" font-size="24" fill="#182033" transform="rotate(-2 665 91)">things that escaped localhost</text>
  
  <path d="M526 340C612 331 638 196 708 187" fill="none" stroke="#182033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M526 340C612 331 638 196 708 187" transform="translate(-1.27 -0.39)" fill="none" stroke="#182033" stroke-width="0.7" stroke-opacity="0.48" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M526 354C596 361 615 345 655 341" fill="none" stroke="#182033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M526 354C596 361 615 345 655 341" transform="translate(-0.19 -0.60)" fill="none" stroke="#182033" stroke-width="0.7" stroke-opacity="0.48" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M526 370C642 423 691 480 800 483" fill="none" stroke="#182033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M526 370C642 423 691 480 800 483" transform="translate(-0.90 -0.96)" fill="none" stroke="#182033" stroke-width="0.7" stroke-opacity="0.48" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#ff765b" stroke-width="2" class="dash">
    <path d="M526 340C612 331 638 196 708 187"/>
    <path d="M526 354C596 361 615 345 655 341"/>
    <path d="M526 370C642 423 691 480 800 483"/>
  </g>
  <text x="555" y="317" class="hand" font-size="13" fill="#ff765b" transform="rotate(-7 555 317)">somehow, this compiles →</text>
  <g transform="rotate(1.1 905 188)">
    <path d="M713 132 L1095 134 L1100 239 L714 244 Z" fill="#ff765b" stroke="#182033" stroke-width="1.7" filter="url(#rough)"/>
    <rect x="867" y="123" width="76" height="19" fill="#fffaf0" fill-opacity="0.72" transform="rotate(-2.77 905 132)"/>
    <text x="732" y="172" class="sans project" fill="#182033">SurgiTrack</text>
    <text x="733" y="199" class="mono small" fill="#182033">computer vision</text>
    <text x="733" y="218" class="mono small" fill="#182033">distributed pipeline</text>
    <text x="1082" y="157" text-anchor="end" class="mono tiny" fill="#182033">OUTPUT / 01</text>
  </g>
<g transform="rotate(-1.7 830 340)">
    <path d="M658 286 L1000 288 L1005 389 L659 394 Z" fill="#9d8cff" stroke="#182033" stroke-width="1.7" filter="url(#rough)"/>
    <rect x="792" y="277" width="76" height="19" fill="#fffaf0" fill-opacity="0.72" transform="rotate(-1.03 830 286)"/>
    <text x="677" y="326" class="sans project" fill="#182033">Picza</text>
    <text x="678" y="353" class="mono small" fill="#182033">campus food</text>
    <text x="678" y="372" class="mono small" fill="#182033">social product</text>
    <text x="987" y="311" text-anchor="end" class="mono tiny" fill="#182033">OUTPUT / 02</text>
  </g>
<g transform="rotate(1.4 965 486)">
    <path d="M803 432 L1125 434 L1130 535 L804 540 Z" fill="#5dd8cc" stroke="#182033" stroke-width="1.7" filter="url(#rough)"/>
    <rect x="927" y="423" width="76" height="19" fill="#fffaf0" fill-opacity="0.72" transform="rotate(1.60 965 432)"/>
    <text x="822" y="472" class="sans project" fill="#182033">Game Twin</text>
    <text x="823" y="499" class="mono small" fill="#182033">470K-game</text>
    <text x="823" y="518" class="mono small" fill="#182033">recommendation engine</text>
    <text x="1112" y="457" text-anchor="end" class="mono tiny" fill="#182033">OUTPUT / 03</text>
  </g>

  <text x="1030" y="566" class="hand" font-size="13" fill="#3e63dd" transform="rotate(3 1030 566)">more in /projects</text>
  
  <path d="M1027 570C1056 578 1085 578 1118 568" fill="none" stroke="#3e63dd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1027 570C1056 578 1085 578 1118 568" transform="translate(0.08 1.15)" fill="none" stroke="#3e63dd" stroke-width="0.7" stroke-opacity="0.48" stroke-linecap="round" stroke-linejoin="round"/>

