  <rect x="42" y="157" width="296" height="17" fill="#d8ff64" transform="rotate(-1 42 157)"/>
  <text x="48" y="173" class="mono" font-size="13" font-weight="800" fill="#182033">SOFTWARE ENGINEER / MAKES THINGS MOVE</text>

